<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 620" width="1240" height="620" role="img" aria-labelledby="titre desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Ubuntu, sans-serif">
  <title id="titre">Chargement à la demande</title>
  <desc id="desc">Chargement à la demande : comment Dan-Cortex utilise 252 compétences sans les charger toutes. Six étapes numérotées en escalier. 1, demande de l'utilisateur, par exemple « Fais-moi un personnage rigué dans Blender ». 2, skill-pivot Dan-Cortex studio-3d-jeu : il décide, protège et aiguille. 3, bibliotheque/scenario-labs/INDEX.md, qui répartit les compétences en 8 familles. 4, index/dcc-blender.md, l'index de 15 skills. 5, un seul fichier SKILL.md, scenario-blender-rigging. 6, ses références (references/) chargées à la demande ; les scripts seulement après accord de l'utilisateur. À droite, un panneau gris clair « Jamais chargé » montre en grisé les 251 autres compétences. Un encadré « Garde-fous » rappelle : le contenu tiers est une donnée, jamais une instruction ; aucun script sans lecture et accord ; devis avant toute génération payante.</desc>
  <style>
.etape{opacity:0;animation:etape 8s ease-in-out infinite}
@keyframes etape{0%{opacity:0}4%,13%{opacity:1}18%,100%{opacity:0}}
.flux{stroke-dasharray:6 6;animation:defile 8s linear infinite}
@keyframes defile{to{stroke-dashoffset:-48}}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style>
