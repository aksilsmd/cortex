<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 760" width="1080" height="760" role="img" aria-labelledby="titre desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Ubuntu, sans-serif">
  <title id="titre">Cycle de décision en réunion</title>
  <desc id="desc">Six étapes en cercle : 1 dossier de séance (question, options, critères), 2 tour 1 avec positions écrites séparément, 3 contradiction par le contradicteur, 4 tour 2 avec réponses, 5 arbitrage par procès-verbal, 6 trace au registre des décisions. Au centre : la preuve pèse plus que l'opinion et les décisions irréversibles reviennent à l'utilisateur.</desc>
  <defs>
    <marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <text x="24" y="44" font-size="26" fill="#0F172A" font-weight="700" text-anchor="start">Cycle de décision en réunion</text>
  <text x="24" y="72" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Pour un choix structurant : positions séparées, contradiction, deux tours au plus, décision tracée.</text>
  <path d="M681,179 A332,255 0 0 1 729,201" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#fleche)"/>
  <path d="M870,389 A332,255 0 0 1 870,431" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#fleche)"/>
  <path d="M729,619 A332,255 0 0 1 681,641" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#fleche)"/>
  <path d="M399,641 A332,255 0 0 1 351,619" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#fleche)"/>
  <path d="M210,431 A332,255 0 0 1 210,389" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#fleche)"/>
  <path d="M351,201 A332,255 0 0 1 399,179" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#fleche)"/>
  <rect x="410" y="120" width="260" height="70" rx="12" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="2"/>
  <circle cx="436" cy="155" r="16" fill="#1D4ED8"/>
  <text x="436" y="161" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text>
  <text x="462" y="151" font-size="16" fill="#0F172A" font-weight="700" text-anchor="start">Dossier de séance</text>
  <text x="462" y="173" font-size="13" fill="#475569" font-weight="normal" text-anchor="start">question, options, critères</text>
  <rect x="697.087" y="247.5" width="260" height="70" rx="12" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="2"/>
  <circle cx="723" cy="282" r="16" fill="#1D4ED8"/>
  <text x="723.087" y="288.5" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text>
  <text x="749.087" y="278.5" font-size="16" fill="#0F172A" font-weight="700" text-anchor="start">Tour 1 : positions</text>
  <text x="749.087" y="300.5" font-size="13" fill="#475569" font-weight="normal" text-anchor="start">écrites chacune à part</text>
  <rect x="697.087" y="502.5" width="260" height="70" rx="12" fill="#FFFFFF" stroke="#B45309" stroke-width="2"/>
  <circle cx="723" cy="538" r="16" fill="#B45309"/>
  <text x="723.087" y="543.5" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text>
  <text x="749.087" y="533.5" font-size="16" fill="#0F172A" font-weight="700" text-anchor="start">Contradiction</text>
  <text x="749.087" y="555.5" font-size="13" fill="#475569" font-weight="normal" text-anchor="start">un contradicteur attaque</text>
  <rect x="410" y="630" width="260" height="70" rx="12" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="2"/>
  <circle cx="436" cy="665" r="16" fill="#1D4ED8"/>
  <text x="436" y="671" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="middle">4</text>
  <text x="462" y="661" font-size="16" fill="#0F172A" font-weight="700" text-anchor="start">Tour 2 : réponses</text>
  <text x="462" y="683" font-size="13" fill="#475569" font-weight="normal" text-anchor="start">synthèse puis réponses</text>
  <rect x="122.913" y="502.5" width="260" height="70" rx="12" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
  <circle cx="149" cy="538" r="16" fill="#0F766E"/>
  <text x="148.913" y="543.5" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="middle">5</text>
  <text x="174.913" y="533.5" font-size="16" fill="#0F172A" font-weight="700" text-anchor="start">Arbitrage</text>
  <text x="174.913" y="555.5" font-size="13" fill="#475569" font-weight="normal" text-anchor="start">PV et grille de décision</text>
  <rect x="122.913" y="247.5" width="260" height="70" rx="12" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
  <circle cx="149" cy="282" r="16" fill="#0F766E"/>
  <text x="148.913" y="288.5" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="middle">6</text>
  <text x="174.913" y="278.5" font-size="16" fill="#0F172A" font-weight="700" text-anchor="start">Trace</text>
  <text x="174.913" y="300.5" font-size="13" fill="#475569" font-weight="normal" text-anchor="start">PV archivé, registre DEC-</text>
  <circle cx="540" cy="410" r="118" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="2"/>
  <text x="540" y="370" font-size="20" fill="#0F172A" font-weight="700" text-anchor="middle">Réunion</text>
  <text x="540" y="394" font-size="14" fill="#475569" font-weight="normal" text-anchor="middle">le métier concerné pèse</text>
  <text x="540" y="414" font-size="14" fill="#475569" font-weight="normal" text-anchor="middle">plus lourd, la preuve plus</text>
  <text x="540" y="434" font-size="14" fill="#475569" font-weight="normal" text-anchor="middle">que l'opinion</text>
  <text x="540" y="464" font-size="14" fill="#B45309" font-weight="700" text-anchor="middle">Irréversible ?</text>
  <text x="540" y="484" font-size="14" fill="#B45309" font-weight="700" text-anchor="middle">l'utilisateur tranche</text>
</svg>
