  <rect x="44" y="166" width="168" height="33" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="54" y="188" font-size="13" fill="#0F172A" font-weight="600" text-anchor="start">skills/</text>
  <rect x="44" y="208" width="168" height="33" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="54" y="230" font-size="13" fill="#0F172A" font-weight="600" text-anchor="start">agents/</text>
