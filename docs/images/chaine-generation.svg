  <text x="792" y="230" font-size="13" fill="#0F172A" font-weight="600" text-anchor="start">--verifier des</text>
  <text x="792" y="249" font-size="13" fill="#0F172A" font-weight="400" text-anchor="start">3 scripts</text>
  <rect x="782" y="269" width="168" height="52" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="792" y="291" font-size="13" fill="#0F172A" font-weight="600" text-anchor="start">cortex.py plugin</text>
  <text x="792" y="310" font-size="13" fill="#0F172A" font-weight="400" text-anchor="start">verifier</text>
  <rect x="782" y="330" width="168" height="33" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="792" y="352" font-size="13" fill="#0F172A" font-weight="600" text-anchor="start">audit robustesse</text>
  <rect x="782" y="372" width="168" height="52" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="792" y="394" font-size="13" fill="#0F172A" font-weight="600" text-anchor="start">matrice Python</text>
  <text x="792" y="413" font-size="13" fill="#0F172A" font-weight="400" text-anchor="start">3.11 à 3.13</text>
