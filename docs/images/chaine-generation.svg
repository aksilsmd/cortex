<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 560" width="1240" height="560" role="img" aria-labelledby="titre desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Ubuntu, sans-serif">
  <title id="titre">De la modification à l'installation</title>
  <desc id="desc">Chaîne de génération en cinq colonnes reliées par des flèches animées, de gauche à droite. 1, Sources : skills/, agents/ et accueil-recueil/references/. 2, Générateurs : generer_catalogues.py, construire_universel.py et construire_plugin.py. 3, Fichiers générés : catalogues et cartes SVG, paquet universel, archive .plugin. 4, Contrôles : tests unittest, option --verifier des trois scripts, cortex.py plugin verifier, audit de robustesse, matrice Python 3.11 à 3.13. 5, Publication : branche main sur GitHub, puis marketplace cortex-projets pour Claude Code ; l'archive est à téléverser dans l'application Claude. Sous la chaîne, la règle : après toute modification d'un skill ou d'un agent, relancer les trois scripts, puis les tests. Chaque fichier généré est vérifié par la CI avant publication.</desc>
  <style>
.flux{stroke-dasharray:8 8;animation:defile 8s linear infinite}
@keyframes defile{to{stroke-dashoffset:-64}}
.seq{animation:seq 8s ease-in-out infinite}
@keyframes seq{0%{stroke:#94A3B8}5%,18%{stroke:#0F766E}26%,100%{stroke:#94A3B8}}
.col{animation:col 8s ease-in-out infinite}
@keyframes col{0%{opacity:.55}5%,18%{opacity:1}26%{opacity:.55}30%,100%{opacity:1}}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style>
  <defs>
    <marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <text x="32" y="48" font-size="26" fill="#0F172A" font-weight="700" text-anchor="start">De la modification à l'installation</text>
  <text x="32" y="76" font-size="15" fill="#475569" font-weight="400" text-anchor="start">Chaque fichier généré est vérifié par la CI avant publication</text>
  <g class="col" style="animation-delay:0.0s">
  <rect x="32" y="104" width="192" height="344" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
  <path d="M32,152 v-38 a10,10 0 0 1 10,-10 h172 a10,10 0 0 1 10,10 v36 z" fill="#475569"/>
