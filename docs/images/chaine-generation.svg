  <rect x="536" y="166" width="168" height="52" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="546" y="188" font-size="13" fill="#0F172A" font-weight="600" text-anchor="start">catalogues docs/</text>
  <text x="546" y="207" font-size="13" fill="#0F172A" font-weight="400" text-anchor="start">+ cartes SVG</text>
  <rect x="536" y="227" width="168" height="33" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="546" y="249" font-size="13" fill="#0F172A" font-weight="600" text-anchor="start">paquet universel</text>
  <rect x="536" y="269" width="168" height="33" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="546" y="291" font-size="13" fill="#0F172A" font-weight="600" text-anchor="start">archive .plugin</text>
  </g>
