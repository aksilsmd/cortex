  <text x="410" y="96" font-size="14" fill="#1D4ED8" font-weight="700" text-anchor="middle">Étudier et concevoir</text>
  <line x1="660" y1="104" x2="950" y2="104" stroke="#0F766E" stroke-width="4" stroke-linecap="round"/>
  <text x="805" y="96" font-size="14" fill="#0F766E" font-weight="700" text-anchor="middle">Construire et valider</text>
  <line x1="976" y1="104" x2="1266" y2="104" stroke="#B45309" stroke-width="4" stroke-linecap="round"/>
  <text x="1121" y="96" font-size="14" fill="#B45309" font-weight="700" text-anchor="middle">Lancer et apprendre</text>
