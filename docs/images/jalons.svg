  <rect x="24" y="366" width="1246" height="52" rx="10" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
  <text x="44" y="388" font-size="14" fill="#0F172A" font-weight="600" text-anchor="start">Porte de chaque jalon : cortex.py jalon verifier Jn, puis jalon franchir Jn.</text>
  <text x="44" y="408" font-size="13" fill="#475569" font-weight="normal" text-anchor="start">Livrables attendus définis dans assets/jalons.json ; contrôles de la matrice clos avec preuve, motif ou risque accepté.</text>
