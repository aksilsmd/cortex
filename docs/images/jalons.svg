<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1294 420" width="1294" height="420" role="img" aria-labelledby="titre desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Ubuntu, sans-serif">
  <title id="titre">Déroulé des jalons J0 à J7</title>
  <desc id="desc">Huit étapes de gauche à droite : J0 Qualification (de quel projet parle-t-on ?), J1 Opportunité (faut-il y aller ?), J2 Cadrage (quoi, pour qui, combien, quand ?), J3 Conception (comment exactement ?), J4 Réalisation (est-ce construit et testé ?), J5 Validation (est-ce prêt ?), J6 Lancement (lancer et tenir), J7 Bilan (qu'a-t-on appris ?), avec leurs livrables principaux et la vérification par script à chaque porte.</desc>
  <defs>
    <marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <text x="24" y="44" font-size="26" fill="#0F172A" font-weight="700" text-anchor="start">Déroulé des jalons, de J0 à J7</text>
  <text x="24" y="72" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Chaque jalon tranche une question ; on peut s'arrêter à n'importe lequel.</text>
  <line x1="28" y1="104" x2="160" y2="104" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
  <text x="94" y="96" font-size="14" fill="#475569" font-weight="700" text-anchor="middle">Qualifier</text>
