<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 760" width="1240" height="760" role="img" aria-labelledby="titre desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Ubuntu, sans-serif">
  <title id="titre">Carte du dépôt Dan-Cortex</title>
  <desc id="desc">Carte du dépôt Dan-Cortex. Au centre, le dossier dan-cortex/, le plugin, contient cinq éléments : skills/ (50 skills chargés à la demande par Claude), agents/ (59 agents experts), bibliotheque/ (252 compétences tierces sous licences MIT et Apache-2.0 : scenario-labs 172, cli-anything 70, understand-anything 9 et scroll-world 1, jamais chargées d'office), universel/ (paquet pour les IA sans accès au dépôt, généré) et les fichiers NOTICE.md et THIRD_PARTY_NOTICES.md (licences tierces). À droite : .claude-plugin/marketplace.json (catalogue d'installation), docs/ (guides, architecture, catalogues générés, images), scripts/ (3 générateurs), tests/ (contrôles automatiques), .github/ (intégration continue, modèles d'issue et de demande de fusion) et dist/dan-cortex.plugin (archive générée). À la racine : README.md, AGENTS.md, CHANGELOG.md, CONTRIBUTING.md, SECURITY.md et LICENSE. Légende : une pastille sarcelle indique une source écrite à la main ; une pastille ambre indique un fichier généré par un script, à ne pas modifier à la main. Sont générés : docs/catalogue-*.md, docs/images/carte-skills.svg, docs/images/carte-poles.svg, dan-cortex/universel/, dist/dan-cortex.plugin, bibliotheque/scenario-labs/INDEX.md et index/.</desc>
