<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 560" width="1240" height="560" role="img" aria-labelledby="titre desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Ubuntu, sans-serif">
  <title id="titre">Flux d'une vague d'agents</title>
  <desc id="desc">Le chef d'orchestre envoie des ordres de mission à quatre experts lancés en parallèle, aidés de sous-agents de collecte. Tous écrivent dans le dossier projet. Les livrables passent en revue croisée, puis le jalon est vérifié par script et le super-auditeur contrôle avant le lancement. Une réunion tranche si une décision est nécessaire. Le chef d'orchestre ne reçoit que des comptes rendus de 150 mots et relance une vague de corrections si besoin.</desc>
  <defs>
    <marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <text x="24" y="44" font-size="26" fill="#0F172A" font-weight="700" text-anchor="start">Flux d'une vague d'agents</text>
  <text x="24" y="72" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Les agents indépendants partent au même instant ; ils se parlent par fichiers, pas par conversation.</text>
  <rect x="24" y="220" width="190" height="110" rx="12" fill="#1E3A8A" stroke="none" stroke-width="1.5"/>
  <text x="119" y="262" font-size="17" fill="#FFFFFF" font-weight="700" text-anchor="middle">Chef d'orchestre</text>
  <text x="119" y="286" font-size="14" fill="#DBEAFE" font-weight="normal" text-anchor="middle">plan de vague,</text>
  <text x="119" y="306" font-size="14" fill="#DBEAFE" font-weight="normal" text-anchor="middle">ordres de mission</text>
  <text x="400" y="112" font-size="15" fill="#1D4ED8" font-weight="700" text-anchor="middle">① Vague parallèle</text>
  <rect x="300" y="128" width="200" height="60" rx="10" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1.5"/>
  <text x="400" y="154" font-size="15" fill="#0F172A" font-weight="700" text-anchor="middle">Expert marché</text>
  <text x="400" y="174" font-size="13" fill="#475569" font-weight="normal" text-anchor="middle">modèle intermédiaire</text>
  <line x1="214" y1="275" x2="298" y2="158" stroke="#334155" stroke-width="1.8" marker-end="url(#fleche)"/>
  <rect x="300" y="204" width="200" height="60" rx="10" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1.5"/>
  <text x="400" y="230" font-size="15" fill="#0F172A" font-weight="700" text-anchor="middle">Expert spécifications</text>
  <text x="400" y="250" font-size="13" fill="#475569" font-weight="normal" text-anchor="middle">modèle intermédiaire</text>
  <line x1="214" y1="275" x2="298" y2="234" stroke="#334155" stroke-width="1.8" marker-end="url(#fleche)"/>
  <rect x="300" y="280" width="200" height="60" rx="10" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1.5"/>
  <text x="400" y="306" font-size="15" fill="#0F172A" font-weight="700" text-anchor="middle">Expert design</text>
  <text x="400" y="326" font-size="13" fill="#475569" font-weight="normal" text-anchor="middle">modèle intermédiaire</text>
  <line x1="214" y1="275" x2="298" y2="310" stroke="#334155" stroke-width="1.8" marker-end="url(#fleche)"/>
  <rect x="300" y="356" width="200" height="60" rx="10" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1.5"/>
  <text x="400" y="382" font-size="15" fill="#0F172A" font-weight="700" text-anchor="middle">Architecte</text>
  <text x="400" y="402" font-size="13" fill="#475569" font-weight="normal" text-anchor="middle">modèle de la session</text>
  <line x1="214" y1="275" x2="298" y2="386" stroke="#334155" stroke-width="1.8" marker-end="url(#fleche)"/>
  <rect x="290" y="440" width="220" height="54" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="400" y="463" font-size="14" fill="#0F172A" font-weight="600" text-anchor="middle">Sous-agents de collecte</text>
  <text x="400" y="482" font-size="13" fill="#475569" font-weight="normal" text-anchor="middle">modèle léger, une source</text>
  <line x1="400" y1="418" x2="400" y2="438" stroke="#334155" stroke-width="1.8" marker-end="url(#fleche)" stroke-dasharray="4 3"/>
  <path d="M545,214 v128 a95,18 0 0 0 190,0 v-128" fill="#F0FDFA" stroke="#0F766E" stroke-width="1.8"/>
  <ellipse cx="640" cy="214" rx="95" ry="18" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.8"/>
  <text x="640" y="264" font-size="16" fill="#0F172A" font-weight="700" text-anchor="middle">Dossier projet</text>
  <text x="640" y="286" font-size="13" fill="#475569" font-weight="normal" text-anchor="middle">livrables, registres,</text>
  <text x="640" y="304" font-size="13" fill="#475569" font-weight="normal" text-anchor="middle">matrice de couverture</text>
  <text x="640" y="112" font-size="15" fill="#0F766E" font-weight="700" text-anchor="middle">② Écrit dans des fichiers</text>
  <line x1="500" y1="158" x2="543" y2="278" stroke="#334155" stroke-width="1.8" marker-end="url(#fleche)"/>
  <line x1="500" y1="234" x2="543" y2="278" stroke="#334155" stroke-width="1.8" marker-end="url(#fleche)"/>
  <line x1="500" y1="310" x2="543" y2="278" stroke="#334155" stroke-width="1.8" marker-end="url(#fleche)"/>
  <line x1="500" y1="386" x2="543" y2="278" stroke="#334155" stroke-width="1.8" marker-end="url(#fleche)"/>
  <line x1="510" y1="467" x2="543" y2="322" stroke="#334155" stroke-width="1.8" marker-end="url(#fleche)" stroke-dasharray="4 3"/>
  <text x="960" y="112" font-size="15" fill="#B45309" font-weight="700" text-anchor="middle">③ Contrôlé</text>
  <rect x="860" y="150" width="200" height="60" rx="10" fill="#FFF7ED" stroke="#B45309" stroke-width="1.5"/>
  <text x="960" y="176" font-size="15" fill="#0F172A" font-weight="700" text-anchor="middle">Revues croisées</text>
  <text x="960" y="196" font-size="13" fill="#475569" font-weight="normal" text-anchor="middle">un métier relit l'autre</text>
  <rect x="860" y="250" width="200" height="60" rx="10" fill="#FFF7ED" stroke="#B45309" stroke-width="1.5"/>
  <text x="960" y="276" font-size="15" fill="#0F172A" font-weight="700" text-anchor="middle">Jalon vérifié</text>
  <text x="960" y="296" font-size="13" fill="#475569" font-weight="normal" text-anchor="middle">par script (cortex.py)</text>
  <rect x="860" y="350" width="200" height="60" rx="10" fill="#FFF7ED" stroke="#B45309" stroke-width="1.5"/>
  <text x="960" y="376" font-size="15" fill="#0F172A" font-weight="700" text-anchor="middle">Super-auditeur</text>
  <text x="960" y="396" font-size="13" fill="#475569" font-weight="normal" text-anchor="middle">avant le lancement</text>
  <line x1="737" y1="250" x2="858" y2="180" stroke="#334155" stroke-width="1.8" marker-end="url(#fleche)"/>
  <line x1="960" y1="210" x2="960" y2="248" stroke="#334155" stroke-width="1.8" marker-end="url(#fleche)"/>
  <line x1="960" y1="310" x2="960" y2="348" stroke="#334155" stroke-width="1.8" marker-end="url(#fleche)"/>
  <rect x="1090" y="250" width="130" height="60" rx="10" fill="#1E3A8A" stroke="none" stroke-width="1.5"/>
  <text x="1155" y="276" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">Réunion</text>
  <text x="1155" y="296" font-size="13" fill="#DBEAFE" font-weight="normal" text-anchor="middle">si décision</text>
  <line x1="1060" y1="280" x2="1088" y2="280" stroke="#334155" stroke-width="1.8" marker-end="url(#fleche)"/>
  <path d="M640,360 L640,530 L119,530 L119,332" fill="none" stroke="#1E3A8A" stroke-width="1.8" marker-end="url(#fleche)"/>
  <rect x="250" y="516" width="340" height="28" rx="10" fill="#FFFFFF" stroke="none" stroke-width="1.5"/>
  <text x="420" y="535" font-size="14" fill="#1E3A8A" font-weight="700" text-anchor="middle">④ Comptes rendus de 150 mots au plus</text>
  <path d="M1155,312 L1155,530 L700,530" fill="none" stroke="#1E3A8A" stroke-width="1.8" marker-end="url(#fleche)" stroke-dasharray="6 4"/>
  <rect x="820" y="516" width="260" height="28" rx="10" fill="#FFFFFF" stroke="none" stroke-width="1.5"/>
  <text x="950" y="535" font-size="14" fill="#1E3A8A" font-weight="600" text-anchor="middle">corrections → nouvelle vague</text>
</svg>
